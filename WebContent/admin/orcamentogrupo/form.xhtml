<ui:composition xmlns="http://www.w3.org/1999/xhtml"   
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core">
   	
   	<div class="tab-content-space">
    
    	<div id="tabViewVar:Title:tab_#{param.id}" class="panelUrlDescricao"></div>
    
	   	<h:form id="edicaoVendedor">
		
			<p:blockUI block="edicaoVendedor" trigger="btnSalvar" widgetVar="bUIVendedor">
				LOADING<br />
	        	<p:graphicImage library="images" name="progress_bar.gif"/>
			</p:blockUI>
			
				<p:focus context="edicaoVendedor" />
				<p:defaultCommand target="btnSalvar" />
				<p:messages id="msgEdicaoVendedor" showDetail="true" showSummary="false" closable="true" />
				
				<p:fieldset legend="Gestão" styleClass="painelFieldset">
					<div class="ui-fluid">
					<p:panelGrid columns="1" columnClasses="ui-grid-col-0" layout="grid" styleClass="ui-panelgrid-blank" >
						<p:selectOneMenu  id="gestao" value="#{vendedorBean.selecionada.gestao}" filter="true"  autoWidth="false" required="true" requiredMessage="Selecione uma gestão">
							<f:selectItem itemLabel="Selecione" itemValue="" />  
							<f:selectItems value="#{vendedorBean.gestaoSelect}" /> 
						</p:selectOneMenu>
					</p:panelGrid>
					</div>
				</p:fieldset>
				
				<p:fieldset legend="Dados" styleClass="painelFieldset">
					<div class="ui-fluid">
					
					<h:outputText rendered="#{vendedorBean.editando}" value="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'F' ? 'Pessoa Física' : ''}#{vendedorBean.selecionada.pessoa.tipoPessoa == 'J' ? 'Pessoa Jurídica' : ''}#{vendedorBean.selecionada.pessoa.tipoPessoa == 'O' ? 'Outro' : ''}" styleClass="tx_bold" style="margin-right:10px;" />
					<p:panelGrid columns="7" columnClasses="ui-grid-col-0,ui-grid-col-0,ui-grid-col-0,ui-grid-col-0,ui-grid-col-0,ui-grid-col-0,ui-grid-col-0" layout="grid" styleClass="ui-panelgrid-blank" >
					 
					 	<p:selectOneMenu id="tipoPessoa" value="#{vendedorBean.selecionada.pessoa.tipoPessoa}" style="width:125px" rendered="#{!vendedorBean.editando}">
			            	<f:selectItem itemLabel="Física" itemValue="F" />
			            	<f:selectItem itemLabel="Jurídica" itemValue="J" />
			            	<f:selectItem itemLabel="Outro" itemValue="O" />
			            	<p:ajax update="@form" listener="#{vendedorBean.verificarTipoPessoa}"/> 
			        	</p:selectOneMenu>
			        
						<p:outputLabel id="labelCnpj" value="CNPJ:" for="cnpj" rendered="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'J' or vendedorBean.selecionada.pessoa.tipoPessoa == 'O'}" />
						<h:panelGroup>
							<p:inputMask id="cnpj" value="#{vendedorBean.selecionada.pessoa.cnpjCpf}" mask="99.999.999/9999-99" required="true" requiredMessage="Preencha o CNPJ" size="19" maxlength="19" rendered="#{(vendedorBean.selecionada.pessoa.tipoPessoa == 'J' or vendedorBean.selecionada.pessoa.tipoPessoa == 'O') and !vendedorBean.editando}">
								<f:validator validatorId="validator.CNPJValidator" disabled="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'O'}" />
								<f:converter converterId="converter.CNPJConverter" />
								<p:ajax event="blur" update="@form msgEdicaoVendedor" listener="#{vendedorBean.verificarCpfCnpj}" onstart="PF('bUIVendedor').show()" onerror="PF('bUIVendedor').hide()" oncomplete="PF('bUIVendedor').hide()" />
							</p:inputMask>
							<h:outputText rendered="#{(vendedorBean.selecionada.pessoa.tipoPessoa == 'J' or vendedorBean.selecionada.pessoa.tipoPessoa == 'O') and vendedorBean.editando}" value="#{vendedorBean.selecionada.pessoa.cnpjCpf}" styleClass="tx_bold">
								<f:converter converterId="converter.CNPJConverter" />
							</h:outputText>
						</h:panelGroup>
					
						<p:outputLabel id="labelInscEst" value="Insc. Estadual:" for="inscEst" rendered="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'J'}"/>
						<p:inputText id="inscEst" value="#{vendedorBean.selecionada.pessoa.inscEst}" required="true" requiredMessage="Preencha o Insc. Estadual" size="14" maxlength="14" rendered="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'J'}" />
						
						<p:outputLabel id="labelInscMun" value="Insc. Municipal:" for="inscMun" rendered="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'J'}"/>
						<p:inputText id="inscMun" value="#{vendedorBean.selecionada.pessoa.inscMun}" size="14" maxlength="14" rendered="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'J'}" />
						
						<p:outputLabel id="labelCpf" value="CPF:" for="cpf" rendered="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'F'}"/>
						<h:panelGroup>
							<p:inputMask id="cpf" value="#{vendedorBean.selecionada.pessoa.cnpjCpf}" mask="999.999.999-99" required="true" requiredMessage="Preencha o CPF" size="15" maxlength="15" rendered="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'F' and !vendedorBean.editando}" >
								<f:validator validatorId="validator.CPFValidator" />
								<f:converter converterId="converter.CPFConverter" />
								<p:ajax event="blur" update="@form msgEdicaoVendedor" listener="#{vendedorBean.verificarCpfCnpj}" onstart="PF('bUIVendedor').show()" onerror="PF('bUIVendedor').hide()" oncomplete="PF('bUIVendedor').hide()" />
							</p:inputMask>
							<h:outputText rendered="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'F' and vendedorBean.editando}" value="#{vendedorBean.selecionada.pessoa.cnpjCpf}" styleClass="tx_bold">
								<f:converter converterId="converter.CPFConverter" />
							</h:outputText>
						</h:panelGroup>
						
						<p:outputLabel id="labelNumRg" value="RG:" for="numRg" rendered="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'F'}"/>
						<p:inputText id="numRg" value="#{vendedorBean.selecionada.pessoa.numRg}" size="15" maxlength="15" rendered="#{vendedorBean.selecionada.pessoa.tipoPessoa == 'F'}" />
						
					</p:panelGrid>
					<p:panelGrid columns="6" columnClasses="ui-grid-col-1,ui-grid-col-3,ui-grid-col-1,ui-grid-col-3,ui-grid-col-1,ui-grid-col-3" layout="grid" styleClass="ui-panelgrid-blank" >
					
							<p:outputLabel value="Razão Social:" for="razaoSocialNome"/>
							<p:inputText id="razaoSocialNome" value="#{vendedorBean.selecionada.pessoa.razaoSocialNome}" required="true" requiredMessage="Preencha a Razão Social" size="40" maxlength="60"/>
							
							<p:outputLabel value="Nome fantasia:" for="nomeFantMnem"/>
							<p:inputText id="nomeFantMnem" value="#{vendedorBean.selecionada.pessoa.nomeFantMnem}" required="true" requiredMessage="Preencha o Nome Fantasia" size="40" maxlength="60"/>
		
							<p:outputLabel value="E-mail:" for="email" />
							<p:inputText id="email" value="#{vendedorBean.selecionada.pessoa.email}" size="15" maxlength="100" validatorMessage="E-mail inválido">
								<f:validateRegex pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
							</p:inputText>
							
					</p:panelGrid>
					</div>
				</p:fieldset>
				<p:fieldset legend="Endereço" styleClass="painelFieldset">
					<div class="ui-fluid">
					<p:panelGrid columns="2" columnClasses="ui-grid-col-1,ui-grid-col-0" layout="grid" styleClass="ui-panelgrid-blank" >
						<p:outputLabel value="CEP:" for="cep" />
						<p:inputMask id="cep" value="#{vendedorBean.endereco.cep}" size="12" required="true" requiredMessage="Preencha o CEP" mask="99999-999">
							<p:ajax event="blur" listener="#{vendedorBean.buscarCep}" update="pais estado municipio bairro logradouro" onstart="PF('bUIVendedor').show()" onerror="PF('bUIVendedor').hide()" oncomplete="PF('bUIVendedor').hide()" />
						</p:inputMask>
						
						<p:outputLabel value="Tipo:" for="enderecoTipo" />
						<p:selectOneMenu id="enderecoTipo" value="#{vendedorBean.endereco.enderecoTipo}">
							<f:selectItems value="#{vendedorBean.enderecoTiposSelect}" />
						</p:selectOneMenu>
					</p:panelGrid>
					
					<p:panelGrid columns="6" columnClasses="ui-grid-col-1,ui-grid-col-3,ui-grid-col-1,ui-grid-col-3,ui-grid-col-1,ui-grid-col-3" layout="grid" styleClass="ui-panelgrid-blank" >
					
						<p:outputLabel value="País: #{vendedorBean.endereco.pais.descricao}" for="pais" />
			        	<p:selectOneMenu  id="pais"
											value="#{vendedorBean.endereco.pais}" 
												required="true" 
													requiredMessage="Selecione um País" filter="true" filterMatchMode="contains" autoWidth="false">
							<f:selectItem itemLabel="" itemValue="" />  
							<f:selectItems value="#{vendedorBean.paisesSelect}" />
							<p:ajax update="estado municipio" listener="#{vendedorBean.verificarPais}"/> 
						</p:selectOneMenu>
						
						<p:outputLabel value="Estado:" for="estado" />
			        	<p:selectOneMenu  id="estado"
											value="#{vendedorBean.endereco.estado}" 
												required="true" 
													requiredMessage="Selecione um Estado" filter="true" filterMatchMode="contains" autoWidth="false">
							<f:selectItem itemLabel="" itemValue="" />  
							<f:selectItems value="#{vendedorBean.estadosSelect}" />
							<p:ajax update="municipio" listener="#{vendedorBean.verificarEstado}"/> 
						</p:selectOneMenu>
			        	
			        	<p:outputLabel value="Município:" for="municipio" />
			        	<p:selectOneMenu  id="municipio"
											value="#{vendedorBean.endereco.municipio}" 
												required="true" 
													requiredMessage="Selecione um Município" filter="true" filterMatchMode="contains" autoWidth="false">
							<f:selectItem itemLabel="" itemValue="" />  
							<f:selectItems value="#{vendedorBean.municipiosSelect}" />
						</p:selectOneMenu>
						
						<p:outputLabel value="Logradouro:" for="logradouro" />
						<p:inputText id="logradouro" value="#{vendedorBean.endereco.logradouro}" required="true" requiredMessage="Preencha o logradouro" maxlength="60" />
						
						<p:outputLabel value="Complemento:" for="complemento" />
						<p:inputText id="complemento" value="#{vendedorBean.endereco.complemento}" maxlength="15" />
						
						<p:outputLabel value="Bairro:" for="bairro" />
						<p:inputText id="bairro" value="#{vendedorBean.endereco.bairro}" required="true" requiredMessage="Preencha o bairro" maxlength="30" />
						
						<p:outputLabel value="Ponto de Referência:" for="pontoReferencia" />
						<h:panelGroup>
							<p:inputTextarea id="pontoReferencia" value="#{vendedorBean.endereco.pontoReferencia}" maxlength="300" counter="displayRef" counterTemplate="{0} caracteres restante." autoResize="false" />
							<h:outputText id="displayRef" />
						</h:panelGroup>
						
					</p:panelGrid>
					</div>
				</p:fieldset>
				
				<p:fieldset legend="Telefone" styleClass="painelFieldset">
					<div class="ui-fluid">
					<p:panelGrid columns="4" columnClasses="ui-grid-col-0,ui-grid-col-0,ui-grid-col-0,ui-grid-col-0" layout="grid" styleClass="ui-panelgrid-blank" >
			        	<p:selectOneMenu id="telefoneTipo"
										 value="#{vendedorBean.telefone.telefoneTipo}">
							<f:selectItems value="#{vendedorBean.telefoneTiposSelect}" />
						</p:selectOneMenu>
						<p:inputMask id="codArea" value="#{vendedorBean.telefone.codArea}" mask="99" size="3" maxlength="2" placeholder="DDD" required="true" requiredMessage="Preencha o DDD" />
						<p:inputText id="numero" value="#{vendedorBean.telefone.numero}" size="10" maxlength="9" placeholder="Telefone" required="true" requiredMessage="Preencha o Telefone">
							<f:converter converterId="converter.NumberPhoneConverter" />
						</p:inputText>
						<p:inputText id="ramal" value="#{vendedorBean.telefone.ramal}" size="10" maxlength="10" placeholder="Ramal"/>
					</p:panelGrid>
					</div>
				</p:fieldset>
				
				<p:fieldset id="fildContato" legend="Contatos " styleClass="painelFieldset" rendered="#{vendedorBean.editando}">
					<p:commandButton value="Novo" 
									 actionListener="#{vendedorBean.novoContato}"
									 update=":edicaoContatoVendedor"
									 process="@this"
									 icon="icon-new" 
									 oncomplete="openContatoVendedorBean()"
									 style="margin-bottom:10px;">
						<p:resetInput target=":edicaoVendedor"  />
					</p:commandButton>
					<p:dataTable id="dtContato" var="contato" value="#{vendedorBean.selecionada.pessoa.contatos}" reflow="true" emptyMessage="Nenhum contato para esse vendedor">
						<p:column>
							<f:facet name="header">Nome</f:facet>
							#{contato.nome}
				        </p:column>
						
						<p:column>
							<f:facet name="header">Setor</f:facet>
							#{contato.setor}
				        </p:column>
				        
				        <p:column>
							<f:facet name="header">Cargo</f:facet>
							#{contato.cargo}
				        </p:column>
				        
				        <p:column>
							<f:facet name="header">Telefone</f:facet>
							<h:outputText value="#{contato.telefone}" converter="converter.NumberPhoneConverter" />
				        </p:column>
				        
				        <p:column>
							<f:facet name="header">E-mail</f:facet>
							<h:outputText value="#{contato.email}">
								<f:converter converterId="converter.NumberPhoneConverter" />
							</h:outputText>
				        </p:column>
				        
				        <p:column styleClass="customCollumn2Icon">
							<f:facet name="header"></f:facet>
							<p:commandButton action="#{vendedorBean.editarContato}" 
											update=":edicaoContatoVendedor" 
											icon="ui-icon-pencil" 
											title="Editar" 
											oncomplete="openContatoVendedorBean()">
								<p:resetInput target=":edicaoContatoVendedor"  />
								<f:setPropertyActionListener target="#{vendedorBean.contato}" value="#{contato}" />
							</p:commandButton> 
							<p:commandButton action="#{vendedorBean.excluirContato}" process="@form:fildContato" update="@form:fildContato" icon="ui-icon-trash" title="Excluir" oncomplete="closeContatoVendedorBean()" >
								<f:setPropertyActionListener target="#{vendedorBean.contato}" value="#{contato}" />
								<p:confirm header="Confirme" message="Deseja Excluir?" icon="ui-icon-alert"  />	
							</p:commandButton>
						</p:column>
			
					</p:dataTable>
					
				</p:fieldset>
				
				<p:commandButton id="btnSalvar" 
						value="#{vendedorBean.editando==true ? 'Salvar' : 'Próximo' }" 
							actionListener="#{vendedorBean.salvar}" 
								update=":edicaoVendedor"
								process="@form"
								icon="#{vendedorBean.editando==true ? 'ui-icon-disk' : 'ui-icon-arrow-1-e' }"  
								oncomplete="closeContatoVendedorBean()"/> 
				
		</h:form>
		
		<p:separator style="margin-bottom:10px; margin-top:10px;" />
		
		<h:form id="edicaoContatoVendedor">
		
			<p:focus context="panelContatoVendedor" />
			
			<p:panel id="panelContatoVendedor" widgetVar="panelContatoVendedor" header="#{vendedorBean.tituloAddContato}" closable="true" >
			
					<p:messages id="msgEdicaoVendedor" showDetail="true" showSummary="false" />
					
					<div class="ui-fluid">
						
						<p:panelGrid columns="6" columnClasses="ui-grid-col-0,ui-grid-col-0,ui-grid-col-0,ui-grid-col-0,ui-grid-col-0,ui-grid-col-0" layout="grid" styleClass="ui-panelgrid-blank" >
							<p:inputText id="nomeContato" value="#{vendedorBean.contato.nome}" size="30" maxlength="60" placeholder="Nome" required="true" requiredMessage="Preencha um nome para o contato." />
							<p:inputText id="setorContato" value="#{vendedorBean.contato.setor}" size="30" maxlength="30" placeholder="Setor" />
							<p:inputText id="cargoContato" value="#{vendedorBean.contato.cargo}" size="30" maxlength="30" placeholder="Cargo" />
							<p:inputText id="emailContato" value="#{vendedorBean.contato.email}" size="30" maxlength="100" placeholder="E-mail" validatorMessage="E-mail inválido">
								<f:validateRegex pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
							</p:inputText>
							<p:inputText id="telefoneContato" value="#{vendedorBean.contato.telefone}" size="15" maxlength="11" placeholder="Telefone" required="true" requiredMessage="Preencha um número de telefone para o contato."/>
							<p:commandButton id="btnSalvarContato" 
									value="Salvar" 
										actionListener="#{vendedorBean.salvarContato}"
											update=":edicaoVendedor:fildContato @form"
											icon="ui-icon-disk"  />
						</p:panelGrid>
					</div>
			</p:panel>
		
		</h:form>
	
	<!-- Script -->
    <script>
		$('#edicaoContatoVendedor\\:panelContatoVendedor').hide();
		function closeContatoVendedorBean(){
			$('#edicaoContatoVendedor\\:panelContatoVendedor').hide();
			focusMsgVendedorBean();
			updateListVendedorBean();
		}
		function openContatoVendedorBean(){
			$('html, body').animate({
				scrollTop: $('#edicaoContatoVendedor\\:panelContatoVendedor').offset().top - 50
			}, 1000);
		}
		
		function closePainalContatoVendedorBean(){
			$('html, body').animate({
				scrollTop: $('#edicaoVendedor\\:fildContato').offset().top - 50
			}, 1000);
		}
		
		function focusMsgVendedorBean(){
			$('html, body').animate({
				scrollTop: $('#edicaoVendedor\\:msgEdicaoVendedor').offset().top - 110
			}, 1000);
		}
	</script>
	</div>
	
</ui:composition>
