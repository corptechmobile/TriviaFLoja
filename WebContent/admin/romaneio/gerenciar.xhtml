<ui:composition xmlns="http://www.w3.org/1999/xhtml"   
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core">
    
    <div class="tab-content-space">
    <div id="tabViewVar:Title:tab_#{param.id}" class="panelUrlDescricao"></div>
    
    <f:metadata>
      <f:viewAction action="#{romaneioGerenciarBean.clearSession}"/>
    </f:metadata>
    
    <!--  -->
    <h:form id="msgRomaneioGerenciar">
     	<p:growl id="msg" showDetail="true" showSummary="false" life="3000"/>
    </h:form>
     
    <!-- Cadastro -->
    <h:form id="edicaoRomaneioGerenciar">
     
     	<p:toolbar id="tb">
	        <f:facet name="left">
	        	<p:commandButton id="btnRefresh" 
		 						value="Atualizar" 
		 						actionListener="#{romaneioGerenciarBean.atualizar}" 
		 						icon="ui-icon-refresh" 
		 						update="@form" />
		 						
	            <p:commandButton id="btnCancelar" 
		 						value="Cancelar" 
		 						actionListener="#{romaneioGerenciarBean.cancelar}" 
		 						icon="ui-icon-cancel" 
		 						update="@form"
		 						rendered="#{romaneioGerenciarBean.renderedBtnCancelar}"> 
					<p:confirm header="Confirme" message="Deseja realmente cancelar o Romaneio?" icon="ui-icon-alert" />	
		 		</p:commandButton>
	            
	            <p:commandButton id="btnFinalizarConf" 
		 						value="Finalizar Ajuste" 
		 						actionListener="#{romaneioGerenciarBean.ajustar}" 
		 						icon="icon-planilhacega-finalizar" 
		 						update="@form"
		 						rendered="#{romaneioGerenciarBean.renderedBtnAjuste}"> 
					<p:confirm header="Confirme" message="Deseja finalizar o ajuste da conferência?" icon="ui-icon-alert" />	
		 		</p:commandButton>
		 		
	        </f:facet>
	        <f:facet name="right">
        	</f:facet>
	    </p:toolbar>
     
     	<p:blockUI block="panelRomaneioGerenciar" trigger="btnFinalizarConf btnRefresh" widgetVar="bUIRomaneioGerenciar">
			LOADING<br />
        	<p:graphicImage library="images" name="progress_bar.gif"/>
		</p:blockUI>
		 
		<p:panel id="panelRomaneioGerenciar" widgetVar="panelRomaneioGerenciar" closable="true">
			
			<p:focus context="panelRomaneioGerenciar"/>
			<p:messages id="msgAdd" showDetail="true" showSummary="false" closable="true"/>
			<p:growl id="msg" showDetail="true" showSummary="false" life="9000"/>
			<!-- Detalhes -->
			<div class="ui-fluid">
				<p:panelGrid id="painelEdicaoItem2" columns="3" columnClasses="ui-grid-col-4,ui-grid-col-4,ui-grid-col-4" layout="grid" styleClass="ui-panelgrid-blank">
					<h:panelGroup>
						<h:outputText value="Romaneio" /> <br/>
						<h:outputText value="#{romaneioGerenciarBean.selecionada.romaneioId}" styleClass="tx_bold" /> <br/>
					</h:panelGroup>
	                <h:panelGroup>
	               		<h:outputText value="Proc. Transp" /> <br/>
	                	<h:outputText value="#{romaneioGerenciarBean.selecionada.procTranspId}" styleClass="tx_bold"/> <br/>
	                </h:panelGroup>

					<h:panelGroup>
						<p:outputLabel value="Status " /><br />
						<h:outputText rendered="#{romaneioGerenciarBean.selecionada.status=='0'}" value="Em Aberto" styleClass="tx_bold"/>
						<h:outputText rendered="#{romaneioGerenciarBean.selecionada.status=='1'}" value="Em conferência" styleClass="tx_bold"/>
						<h:outputText rendered="#{romaneioGerenciarBean.selecionada.status=='2'}" value="Conferido" styleClass="tx_bold"/>
						<h:outputText rendered="#{romaneioGerenciarBean.selecionada.status=='3'}" value="Conferido com Corte" styleClass="tx_bold"/>
						<h:outputText rendered="#{romaneioGerenciarBean.selecionada.status=='4'}" value="Finalizado" styleClass="tx_bold"/>
						<h:outputText rendered="#{romaneioGerenciarBean.selecionada.status=='5'}" value="Cancelado" styleClass="tx_bold"/>
					</h:panelGroup>
					<h:panelGroup>	
						<p:outputLabel value="Liberado " /><br/>
		              	<h:outputText value="#{romaneioGerenciarBean.selecionada.momentoGer}" styleClass="tx_bold">
							<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
						</h:outputText>
						<h:outputText value=" - #{romaneioGerenciarBean.selecionada.usuarioGer}" styleClass="tx_bold" />
					</h:panelGroup>
					<h:panelGroup rendered="#{not empty romaneioGerenciarBean.selecionada.momentoCorte}">  	
		              	<ui:fragment styleClass="tx_bold">
						<p:outputLabel value="Conferido com Corte "  /><br/>
		              	<h:outputText value="#{romaneioGerenciarBean.selecionada.momentoCorte}" styleClass="tx_bold">
							<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
						</h:outputText>
						<h:outputText value=" - #{romaneioGerenciarBean.selecionada.usuarioCorte}" styleClass="tx_bold" />
						</ui:fragment>
					</h:panelGroup>
		            <h:panelGroup rendered="#{not empty romaneioGerenciarBean.selecionada.momentoConf}">  	
		              	<ui:fragment styleClass="tx_bold">
						<p:outputLabel value="Conferido "  /><br/>
		              	<h:outputText value="#{romaneioGerenciarBean.selecionada.momentoConf}" styleClass="tx_bold">
							<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
						</h:outputText>
						<h:outputText value=" - #{romaneioGerenciarBean.selecionada.usuarioConf}" styleClass="tx_bold" />
						</ui:fragment>
					</h:panelGroup>	
					<h:panelGroup rendered="#{not empty romaneioGerenciarBean.selecionada.momentoCanc}">
						<ui:fragment  styleClass="tx_bold">
						<p:outputLabel value="Cancelado "  /><br/>
						<h:outputText value="#{romaneioGerenciarBean.selecionada.momentoCanc}" styleClass="tx_bold" >
							<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
						</h:outputText>
						<h:outputText value=" - #{romaneioGerenciarBean.selecionada.usuarioCanc}" styleClass="tx_bold" />
						</ui:fragment>
					</h:panelGroup>	
			        <h:panelGroup rendered="#{not empty romaneioGerenciarBean.selecionada.momentoFinalizado}">	
						<ui:fragment  styleClass="tx_bold">
						<p:outputLabel value="Finalizado "  /><br/>
						<h:outputText value="#{romaneioGerenciarBean.selecionada.momentoFinalizado}" styleClass="tx_bold">
							<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
						</h:outputText>
						<h:outputText value=" - #{romaneioGerenciarBean.selecionada.usuarioFinalizado}" styleClass="tx_bold" />
						</ui:fragment>
					</h:panelGroup>
				</p:panelGrid>
			</div>
			
			<br />
				
				<div class="w3-row">
				  
				  <div class="w3-col m8 s12 l12">  
				    <p:fieldset id="fildSetRomaneioItens" 
			 						legend="Itens" 
			 							 styleClass="painelFieldset">
			 				
			 				
			 				<h:outputText value="#{item.produtoCod} " />
			 				<p:tabView id="tabViewRomaneioItens" widgetVar="tabViewRomaneioItens" activeIndex="#{romaneioGerenciarBean.currentTab}" styleClass="tabContent" dynamic="true" cache="false">
			 					<p:ajax event="tabChange" listener="#{romaneioGerenciarBean.onTabChange}" update="@none"/>
								<p:ajax event="tabClose" listener="#{romaneioGerenciarBean.onTabClose}" update="@form"/>	
			 					<p:ajax event="tabClose" listener="#{romaneioGerenciarBean.onTabCloseAssocCodBarras}" update="@form:fildSetRomaneioItens"/>
			 					
    							<p:tab title="Itens (#{romaneioGerenciarBean.itens.size()})">
					 				<p:dataTable id="dataTableRomaneioItens" 
						 				value="#{romaneioGerenciarBean.itens}" 
						 				var="item"
						 				reflow="true"
						 				emptyMessage="Nenhuma item encontrado." >
						 				
						 				<p:column headerText="Produto">
						 					<h:outputText value="#{item.produtoCod} " /> <br />
						 					<h:outputText value="#{item.produtoDesc}" />
						 				</p:column>
						 				
						 				<p:column headerText="Qtd" styleClass="customCollumnValor">
						 					<h:outputText value="#{item.qtdRomaneio}" styleClass="tx_bold">
						 						<f:convertNumber maxFractionDigits="1" locale="pt_BR" />
						 					</h:outputText> #{item.unidadeDesc} 
						 				</p:column>
						 				
						 				<p:column headerText="Conferido" styleClass="customCollumnValor">
						 					<h:outputText value="#{item.qtdConferida}" styleClass="tx_bold">
						 						<f:convertNumber maxFractionDigits="1" locale="pt_BR" />
						 					</h:outputText> #{item.unidadeDesc} 
						 				</p:column>
						 				
						 				<p:column headerText="Ajuste" styleClass="customCollumnValor">
						 					<h:outputText value="#{item.qtdAjuste}">
						 						<f:convertNumber maxFractionDigits="1" />
						 					</h:outputText> #{item.unidadeDesc}  
						 				</p:column>
						 				
						 				<p:column headerText="Retirada" styleClass="customCollumnValor">
						 					<h:outputText value="#{item.qtdRetirada}">
						 						<f:convertNumber maxFractionDigits="1" />
						 					</h:outputText> #{item.unidadeDesc}  
						 				</p:column>
						 				
						 				<p:column headerText="" styleClass="customCollumn1Icon">
						 					<h:graphicImage library="images" name="#{item.qtdRomaneio!=(item.qtdConferida+item.qtdRetirada) ? 'help_C.png' : 'help_F.png'}" width="12" />
						 					<h:graphicImage library="images" name="warning.png" rendered="#{(item.qtdRomaneio > (item.qtdConferida+item.qtdRetirada))}" width="12"/>
						 				</p:column>
						 				
						 				<p:columnGroup type="footer">
								            <p:row>
								                <p:column style="text-align:right">
								                	<f:facet name="footer">
								                		<h:outputText value="Total:" styleClass="tx_bold" />
								                	</f:facet>
								                </p:column>
								                <p:column style="text-align:right">
								                	<f:facet name="footer" >
								                		<h:outputText value="#{romaneioGerenciarBean.totalQtdRomaneio}" styleClass="tx_bold"><f:convertNumber maxFractionDigits="3" locale="pt_BR" /></h:outputText>
								                	</f:facet>
								                </p:column> 
								                <p:column style="text-align:right">
								                	<f:facet name="footer">
								                		<h:outputText value="#{romaneioGerenciarBean.totalQtdConferida}" styleClass="tx_bold"><f:convertNumber maxFractionDigits="3" locale="pt_BR" /></h:outputText>
								                	</f:facet>
								                </p:column>
								                <p:column style="text-align:right">
								                	<f:facet name="footer">
								                		<h:outputText value="#{romaneioGerenciarBean.totalQtdAjuste}" styleClass="tx_bold"><f:convertNumber maxFractionDigits="3" locale="pt_BR" /></h:outputText>
							                		</f:facet>
								                </p:column>
								                <p:column style="text-align:right">
								                	<f:facet name="footer">
								                		<h:outputText value="#{romaneioGerenciarBean.totalQtdRetirada}" styleClass="tx_bold"><f:convertNumber maxFractionDigits="3" locale="pt_BR" /></h:outputText>
							                		</f:facet> 
								                </p:column>
								                <p:column footerText="" />
								                <p:column footerText="" />
								            </p:row>
								        </p:columnGroup>
								        
								        <p:column styleClass="customCollumn2Icon" exportable="false">
										<f:facet name="header"></f:facet>
										<p:commandButton action="#{romaneioGerenciarBean.openItensAAjustar}"
												update="@form:fildSetRomaneioItens" process="@this" icon="ui-icon-wrench"
												title="Ajustar"
												rendered="#{item.qtdAjuste gt 0 or item.qtdRetirada gt 0}">	 			
												<f:setPropertyActionListener
													target="#{romaneioGerenciarBean.itemSelecionado}" value="#{item}" />
										</p:commandButton>
										<p:commandButton 
												 id="btnVisualizarLeituras" 
												 actionListener="#{romaneioGerenciarBean.visualizarLeituras}"
												 update="@form:fildSetRomaneioItens :msgRomaneioGerenciar"
												 process="@this"
												 title="Visualizar Leituras"
												 icon="icon-search" 
												 disabled="#{item.leituras==0}"
												 oncomplete="PF('tabViewRomaneioItens').select(1);"
												 >
												 <f:setPropertyActionListener target="#{romaneioGerenciarBean.romaneioItemFB}" value="#{item}" />
											</p:commandButton> 

										</p:column> 
										
						 				
						 		</p:dataTable>
						 	</p:tab>
						 	<p:tab title="Leituras" rendered="#{romaneioGerenciarBean.tabVisualizarLeituras}" id="tabLeiturasItemMov" closable="true">
						    	#{romaneioGerenciarBean.romaneioItemFB.produtoCod} - #{romaneioGerenciarBean.romaneioItemFB.produtoDesc}
					     		<p:toolbar id="tbDlgRomaneioGerenciar">
							        <f:facet name="left"> 
							     		<p:commandButton id="btnExcluirLeituras"  
								 						value="Excluir" 
								 						action="#{romaneioGerenciarBean.excluirTodasLeituras}" 
								 						icon="ui-icon-trash" 
								 						update="@form:fildSetRomaneioItens  :msgRomaneioGerenciar"
								 						oncomplete="PF('tabViewRomaneioItens').select(0	);"
								 						disabled="#{romaneioGerenciarBean.disableExcluirLeituras or empty romaneioGerenciarBean.itensMov or romaneioGerenciarBean.selecionada.status == '4'}">
											<p:confirm header="Confirme" message="Todas as leituras serão excluídas, confirma?" icon="ui-icon-alert" />	
								 		</p:commandButton>		
						     		</f:facet>
					     		</p:toolbar>
					     		<!-- Itens Leitura -->
							    <p:dataTable id="dataTableRomaneioItensMov" 
							 				value="#{romaneioGerenciarBean.itensMov}" 
							 				var="item"
							 				reflow="true"
							 				emptyMessage="Nenhuma leitura para esse produto." 
							 				>
							 				
							 				<p:column headerText="Código">
							 					<h:outputText value="#{item.codBarra}" />
							 				</p:column>
							 				
							 				<p:column headerText="Registrado" styleClass="customCollumnDataHora">
							 					<h:outputText value="#{item.dtLeitura}" >
													<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
												</h:outputText>
							 				</p:column>
							 				
							 				<p:column headerText="Usuário">
							 					<h:outputText value="#{item.usuarioNome}" />
							 				</p:column>
							 				
							 				<p:column headerText="Qtd" styleClass="customCollumnValor">
							 					<h:outputText value="#{item.qtd}">
							 						<f:convertNumber minFractionDigits="#{item.qtdDecimal}" locale="pt_BR" />
							 					</h:outputText>
							 				</p:column>
							 				
							 				<p:column headerText="" styleClass="customCollumn2Icon">
							 				
							 					<p:commandButton id="btnExcluirItemMov" 
								 						title="Excluir" 
								 						action="#{romaneioGerenciarBean.excluirLeitura}" 
								 						icon="ui-icon-trash" 
								 						update="@form:fildSetRomaneioItens :msgRomaneioGerenciar"
								 						disabled="#{romaneioGerenciarBean.disableExcluirLeituras or romaneioGerenciarBean.selecionada.status == '4'}">
							 							
							 							<f:setPropertyActionListener target="#{romaneioGerenciarBean.romaneioContagemFB}" value="#{item}" />
														<p:confirm header="Confirme" message="Deseja realmente excluir a leitura?" icon="ui-icon-alert" />
														
										 		</p:commandButton>	
										 		
							 				</p:column>
							 				
							 		</p:dataTable>
						    </p:tab>
						    <p:tab id="tabViewItemAjuste" widgetVar="tabViewItemAjuste" title="Ajustar" rendered="#{romaneioGerenciarBean.renderedTabAjusteProduto}" closable="true">
						    	<p:panelGrid columns="1" columnClasses="ui-grid-col-0" layout="grid" styleClass="ui-panelgrid-blank">
						        	<h:panelGroup>
						        		<h:outputText value="Produto" styleClass="tituloLayout" /><br/>
					 					<h:outputText value="#{romaneioGerenciarBean.itemProduto}" styleClass="tx_bold"/>
					 				</h:panelGroup>
						    	</p:panelGrid>
						    	<p:panelGrid columns="3" columnClasses="ui-grid-col-4,ui-grid-col-4,ui-grid-col-4" layout="grid" styleClass="ui-panelgrid-blank">
							    	<h:panelGroup>
								    	<h:outputText value="Qtd. Romaneio" styleClass="tituloLayout" /><br/>
						 				<h:outputText value="#{romaneioGerenciarBean.itemQtdRomaneio}" styleClass="tx_bold">
					 						<f:convertNumber minFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" maxFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" locale="pt_BR" />
					 					</h:outputText> 
					 					<h:outputText value=" #{romaneioGerenciarBean.itemUnidade}" styleClass="tx_bold" />
				 					</h:panelGroup>
					 				<h:panelGroup>
					 				<h:outputText value="Qtd. Conferida" styleClass="tituloLayout" /><br/>
					 				<h:outputText value="#{romaneioGerenciarBean.itemQtdConferido}" styleClass="tx_bold">
				 						<f:convertNumber minFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" maxFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" locale="pt_BR" />
				 					</h:outputText>
				 					<h:outputText value=" #{romaneioGerenciarBean.itemUnidade}" styleClass="tx_bold" />
				 					</h:panelGroup>
					 				<h:panelGroup>
					 				<h:outputText value="Saldo a Ajustar" styleClass="tituloLayout" /><br/>
					 				<h:outputText id="saldoAAjustar" value="#{romaneioGerenciarBean.saldoAAjustar}" styleClass="tx_bold">
				 						<f:convertNumber minFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" maxFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" locale="pt_BR" />
				 					</h:outputText>
				 					<h:outputText value=" #{romaneioGerenciarBean.itemUnidade}" styleClass="tx_bold" />
				 					</h:panelGroup>
						    	</p:panelGrid>
						    	<p:dataTable id="dataTableRomaneioItensAAjustar" 
						 				value="#{romaneioGerenciarBean.listRomaneioItemDTOFB}" 
						 				var="itemAjuste"
						 				reflow="true"
						 				emptyMessage="Nenhuma item encontrado." ><!-- rowStyleClass="#{item.qtdAvaria gt 0 or ((item.quantidade-(item.qtdLeitura+item.qtdAvaria+item.qtdDevolvida)) lt 0) or (!(item.produtoPrazo > item.tolShelfLife) and item.controlaLote == 1) ? 'customRowColorAvaria' : null}" -->
						 				
						 				<p:column headerText="Cliente">
						 					<h:outputText value="#{itemAjuste.cnpjCpf}"
												rendered="#{itemAjuste.clienteTipo == 'J' or itemAjuste.clienteTipo == 'O'}"
												converter="converter.CNPJConverter" />
											<h:outputText value="#{itemAjuste.cnpjCpf}"
												rendered="#{itemAjuste.clienteTipo == 'F'}"
												converter="converter.CPFConverter" /><br />
						 					<h:outputText value="#{itemAjuste.clienteDesc}" />
						 				</p:column>
						 				
						 				<p:column headerText="Pedido" styleClass="customCollumnTelefone">
						 					<h:outputText value="#{itemAjuste.pedVendaId} " />
						 				</p:column>

						 				<p:column headerText="Qtd. Pedido" styleClass="customCollumnTotal">
						 					<h:outputText value="#{itemAjuste.qtdPedido}" styleClass="tx_bold">
						 						<f:convertNumber minFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" maxFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" locale="pt_BR" />
						 					</h:outputText> #{itemAjuste.unidadeDesc}
						 				</p:column>
						 				
						 				<p:column headerText="Corte" styleClass="customCollumnValorGigante">
											<p:inplace editor="true" rendered="#{romaneioGerenciarBean.selecionada.status!='2'}">
    
											    <!-- Força o inplace a exibir a saída formatada do h:outputText quando fechado -->
											    <f:facet name="output">
											        <h:outputText value="#{itemAjuste.qtdRetirada}">
											            <f:convertNumber minFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" 
											                             maxFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" 
											                             locale="pt_BR" />
											        </h:outputText>
											    </f:facet>
											
											    <!-- O input abre apenas quando for clicado para editar -->
											    <f:facet name="input">
											        <p:ajax event="save" update="@form @form:edicaoRomaneioGerenciar:btnFinalizarConf" listener="#{romaneioGerenciarBean.editarCorte(itemAjuste)}" />
											        <p:inputNumber id="corte" 
											                       value="#{itemAjuste.qtdRetirada}" 
											                       minValue="0" 
											                       decimalPlaces="#{romaneioGerenciarBean.qtdDecimal}" 
											                       decimalSeparator="," 
											                       thousandSeparator="." 
											                       onkeypress="if (event.keyCode === 13) { $(this).closest('.ui-inplace').find('.ui-inplace-save').click(); return false; }"/>
											    </f:facet>
											</p:inplace>
											<h:outputText value="#{itemAjuste.qtdRetirada}" styleClass="tx_bold" rendered="#{romaneioGerenciarBean.selecionada.status=='2'}">
						 						<f:convertNumber minFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" maxFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" locale="pt_BR" />
						 					</h:outputText>
						 				</p:column>
						 				
						 				<p:columnGroup type="footer">
								            <p:row>
								                <p:column footerText="" />
								                <p:column style="text-align:right">
								                	<f:facet name="footer">
								                		<h:outputText value="Total:" styleClass="tx_bold" />
								                	</f:facet>
								                </p:column>
								                <p:column style="text-align:right">
								                	<f:facet name="footer">
								                		<h:outputText value="#{romaneioGerenciarBean.totalQtdPedido}" styleClass="tx_bold"><f:convertNumber minFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" maxFractionDigits="#{romaneioGerenciarBean.qtdDecimal}" locale="pt_BR" /></h:outputText>
								                	</f:facet>
								                </p:column>
