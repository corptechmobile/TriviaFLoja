<style>

	        	</f:facet>
		    </p:toolbar>

			<p:sticky target="tb" margin="50" />

				<h:panelGroup>
					<h:outputLabel value="Ano/Mês:" for="anoMes"/><br/>
			        <p:inputMask id="anoMes" value="#{consultaLinhaProdutoMetaBean.anoMes}" mask="9999/99" placeholder="Ano/Mês" size="7"  required="true" requiredMessage="Informe o Ano/Mês" converter="anoMesConverter"  />
				</h:panelGroup>
				<h:panelGroup>
					<h:outputLabel value="Empresa:" for="empresaIdFilter"/><br/>
			        <p:selectOneMenu  id="empresaIdFilter" value="#{consultaLinhaProdutoMetaBean.empresaFilter}" filter="true" autoWidth="true" required="true" requiredMessage="Selecione uma Empresa">
						<f:selectItem itemLabel="Todas" itemValue="#{null}" />  
						<f:selectItems value="#{consultaLinhaProdutoMetaBean.empresaSelect}" /> 
					</p:selectOneMenu>
				</h:panelGroup>
				<h:panelGroup>
					<h:outputLabel value="Vendedor:" for="vendedorIdFilter"/><br/>
			        <p:selectOneMenu  id="vendedorIdFilter" value="#{consultaLinhaProdutoMetaBean.vendedorFilter}" converter="vendedorFBConverter" filter="true" autoWidth="true" >
						<f:selectItem itemLabel="Todos" itemValue="#{null}" />  
						<f:selectItems value="#{consultaLinhaProdutoMetaBean.vendedorSelect}" /> 
					</p:selectOneMenu>
				</h:panelGroup>	
				<h:panelGroup>			
					<h:outputLabel value="Gestão:" for="gestaoMobIdFilter"/><br/>
			        <p:selectOneMenu  id="gestaoMobIdFilter" value="#{consultaLinhaProdutoMetaBean.gestaoVendaMobFilter}" filter="true" autoWidth="true" required="true" requiredMessage="Selecione uma Empresa">
						<f:selectItems value="#{consultaLinhaProdutoMetaBean.gestaoVendaMobFilterSelect}" />  
					</p:selectOneMenu>
				</h:panelGroup>
				<h:panelGroup>
					<h:outputLabel value="Visualizar por:" for="visualizarFilter"/><br/>
			        <p:selectOneMenu  id="visualizarFilter" value="#{consultaLinhaProdutoMetaBean.visualizarFilter}" filter="true" autoWidth="true" required="true" requiredMessage="Selecione a forma de visualização">
						<f:selectItem itemLabel="Vendedor" itemValue="vendedor" />   
						<f:selectItem itemLabel="Linha de Produto" itemValue="linhaproduto" />  
					</p:selectOneMenu>
				</h:panelGroup>
				<h:panelGroup>			
					<h:outputLabel value=" " /><br/>
					<p:selectBooleanCheckbox id="semEstoqueFilter" value="#{consultaLinhaProdutoMetaBean.incluirDevolucao}" />
					<p:outputLabel value=" Incluir Devolução " />

									 />
				</h:panelGroup>
				<h:panelGroup>	
					<h:outputLabel value=" " /><br/>

									 update="@form :listaConsLinhaProdutoMeta "
