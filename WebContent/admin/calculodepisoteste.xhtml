<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:util="http://java.sun.com/jsf/composite/components/util">
	
<h:head> 
	<title>Calculo de Piso</title>
</h:head>
	
<h:body>

	<h:form id="formOpen">
		<p:outputLabel value="Unidade mínima de compra (1 caixa): " for="comp"/>
		<p:inputNumber value="#{calcularPisoBean.qtdVendaAtac}" id="comp" decimalSeparator="," thousandSeparator="" decimalPlaces="2" required="true" />
		<br />
		<p:commandButton id="btnCalcularPiso" update="@none" actionListener="#{pedVendaNovoBean.novoCalculoPiso}" value="Calculadora de Pisos" oncomplete="PF('ovlPanelCalcPiso').show('#{component.clientId}')"/>
    </h:form>
    
    <util:calculadorapiso />   

</h:body>

</html>
