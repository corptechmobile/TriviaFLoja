<ui:composition xmlns="http://www.w3.org/1999/xhtml"   
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core">
    
    <div class="tab-content-space">
    
    	<div id="tabViewVar:Title:tab_-1" class="panelUrlDescricao" style="display:none;"></div>
		
		<h:form id="edicaoMudarSenha">
		
			<p:blockUI block="panelMudarSenha" trigger="btnSalvar" widgetVar="bUIMudarSenha">
				LOADING<br />
	        	<p:graphicImage library="images" name="progress_bar.gif"/>
			</p:blockUI>
			
			<p:panel id="panelMudarSenha" header="#{mudarSenhaBean.selecionada.nome}">
				
				<p:focus context="panelMudarSenha"/>
				<p:messages showDetail="true" showSummary="false" closable="true"/>
				
				<h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="5">
				
					<h:outputLabel value="Senha-atual:" for="senha_atual" rendered="#{mudarSenhaBean.verificarSenhaAtual}" />
					<p:password id="senha_atual" value="#{mudarSenhaBean.senha_atual}" label="Senha Atual" required="true" requiredMessage="Digite sua senha atual" rendered="#{mudarSenhaBean.verificarSenhaAtual}" />
									
					<h:outputLabel value="Nova Senha:" for="senha_nova"/>
					<p:password id="senha_nova" value="#{mudarSenhaBean.senha_nova}" label="Nova Senha" match="senha_confirma" redisplay="true" required="true" requiredMessage="Senha é obrigatório" validatorMessage="Nova Senha não está igual a Senha-confirma" feedback="true"/>
					
					<h:outputLabel value="Senha-confirma:" for="senha_confirma"/>
					<p:password id="senha_confirma" value="#{mudarSenhaBean.senha_confirma}" label="Senha-confirma" required="true" redisplay="true" requiredMessage="Confirme a sua senha."/>
					
				</h:panelGrid>
					
				<p:commandButton id="btnSalvar"
						value="Salvar" 
							action="#{mudarSenhaBean.salvar}" 
								update=":edicaoMudarSenha" 
								 icon="ui-icon-disk"/> 
							
			</p:panel>
		</h:form>
	</div>
</ui:composition>
