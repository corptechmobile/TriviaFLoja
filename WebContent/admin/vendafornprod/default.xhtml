<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core">

	<div class="tab-content-space">
		<div id="tabViewVar:Title:tab_#{param.id}" class="panelUrlDescricao"></div>
		<f:metadata>
			<f:viewAction action="#{vendaFornBean.clearSession}" />
		</f:metadata>


		<!-- Filtro -->
		<h:form id="consultaVendaFornBean">

			<p:growl id="msg" showDetail="true" life="3000" />
			<p:focus context="panelFiltroVendaForn" />
			<p:defaultCommand target="btnBuscar" />

			<p:toolbar id="tb">
				<f:facet name="right">
					<p:commandButton id="menuHome" icon="ui-icon-home" actionListener="#{vendaFornBean.addHome}" update="@form:msg" process="@this" title="Home" />
					<p:commandButton icon="ui-icon-star" actionListener="#{vendaFornBean.addFavoritos}" update="@form:msg" process="@this" title="Favoritos" oncomplete="updateMenuHome();" />
				</f:facet>
			</p:toolbar>

			<p:sticky target="tb" margin="50" />

			<p:panel id="panelFiltroVendaForn" widgetVar="panelFiltroVendaForn">
				<div class="ui-fluid">
					<p:panelGrid columns="10"
						columnClasses="ui-grid-col-0, ui-grid-col-0, ui-grid-col-0, ui-grid-col-0, ui-grid-col-0, ui-grid-col-0, ui-grid-col-0, ui-grid-col-0, ui-grid-col-0, ui-grid-col-0"
						layout="grid" styleClass="ui-panelgrid-blank">
					
							<h:panelGroup>
								<h:outputLabel for="empresa" value="Empresa: " />
								<br />
								<p:selectOneMenu id="empresa"
									value="#{vendaFornBean.empresaFilter}" filter="false"
									autoWidth="true">
									<f:selectItem itemLabel="Todas" value="#{null}" />
									<f:selectItems value="#{vendaFornBean.empresasSelect}" />
								</p:selectOneMenu>
							</h:panelGroup>
<!-- 
						<div class="ui-g-0 ui-md-0 ui-lg-0">
							<h:panelGroup>
								<h:outputLabel for="segmento" value="Segmento: " />
								<br />
								<p:selectOneMenu id="segmento"
									value="#{vendaGeralBean.segmentoFilter}" filter="false"
									autoWidth="true"> 
									<f:selectItem itemLabel="Todos" itemValue="null" />
									<f:selectItem itemLabel="Atacado" itemValue="atacado" />
									<f:selectItem itemLabel="Varejo" itemValue="varejo" />
								</p:selectOneMenu>
							</h:panelGroup> 
						</div>	
						
						<div class="ui-g-0 ui-md-0 ui-lg-0">
							<h:panelGroup>
								<h:outputLabel for="vendasPor" value="Vendas Por: " />
								<br />
								<p:selectOneMenu id="vendasPor"
									value="#{vendaGeralBean.vendasPorFilter}" filter="false"
									autoWidth="true"> 
									<f:selectItem itemLabel="Pedido" itemValue="pedido" />
									<f:selectItem itemLabel="Nota Fiscal" itemValue="notafiscal" />
								</p:selectOneMenu>
							</h:panelGroup>
						</div>
 -->							
 
					        <h:panelGroup>
								<h:outputLabel value="Vendedor:" for="vendedorIdFilter"/> <br />
						        <p:selectOneMenu  id="vendedorIdFilter" value="#{vendaFornBean.vendedorFilter}" converter="vendedorFBConverter" filter="true" autoWidth="true" >
									<f:selectItem itemLabel="Todos" itemValue="#{null}" />  
									<f:selectItems value="#{vendaFornBean.vendedorSelect}" /> 
								</p:selectOneMenu>
							</h:panelGroup>
							
							<h:panelGroup>
								<h:outputLabel value="TipoVendedor:" for="tipoVendedorIdFilter"/> <br />
						        <p:selectOneMenu  id="tipoVendedorIdFilter" value="#{vendaFornBean.tipoVendedorFilter}" converter="tipoVendedorFBConverter" filter="true" autoWidth="true" >
									<f:selectItem itemLabel="Todos" itemValue="#{null}" />  
									<f:selectItems value="#{vendaFornBean.tipoVendedorSelect}" /> 
								</p:selectOneMenu> 
							</h:panelGroup>
							<!-- 
							<h:panelGroup>
								<h:outputLabel value="Tipo Vendedor:" for="tipoVendedorIdFilter"/> <br />
						        <p:selectOneMenu  id="tipoVendedorIdFilter" value="#{vendaFornBean.tipoVendedorFilter}" converter="vendedorFBConverter" filter="true" autoWidth="true" >
									<f:selectItem itemLabel="Todos" itemValue="#{null}" />  
									<f:selectItems value="#{vendaFornBean.vendedorSelect}" /> 
								</p:selectOneMenu>
							</h:panelGroup>
							 -->
							<h:panelGroup>
								<p:outputLabel value="Por:" />
								<br />
								<p:selectOneMenu id="opcoes" value="#{vendaFornBean.porFilter}">
									<p:ajax update="@form:opcoes1" />
									<f:selectItem itemLabel="Linha de Produto" itemValue="linhaProduto" />	
									<f:selectItem itemLabel="Fornecedor" itemValue="fornecedor" />
									<f:selectItem itemLabel="Vendedor" itemValue="vendedor" />
									<f:selectItem itemLabel="F. Pagto" itemValue="fpagto" />
									<f:selectItem itemLabel="Tipo Vendedor" itemValue="tipovend" />									
								</p:selectOneMenu>
							</h:panelGroup>

							<h:panelGroup>
								<p:outputLabel value="Período:" />
								<br />
								<p:panelGrid columns="3" styleClass="ui-panelgrid-blank">
									<p:calendar id="dataFilter1"
										value="#{vendaFornBean.dataFilter1}" pattern="dd/MM/yyyy"
										size="10" mask="99/99/9999" label="Data 'de'"
										converterMessage="Data inválida" 
										required="true" requiredMessage="Data 'de' é obrigatório"/>
									<h:outputLabel value=" à " />
									<p:calendar id="dataFilter2"
										value="#{vendaFornBean.dataFilter2}" pattern="dd/MM/yyyy"
										size="10" mask="99/99/9999" label="Data 'até'"
										converterMessage="Data inválida" 
										required="true" requiredMessage="Data 'até' é obrigatório"/>
								</p:panelGrid>
							</h:panelGroup>
						
							<h:panelGroup rendered="false">
								<p:outputLabel value="Tipo:" />
								<br />
								<p:selectOneRadio id="opcoes1" value="#{vendaFornBean.autoServicoPedAmbos}" disabled="#{vendaFornBean.porFilter eq 'fpagto'}">
									<f:selectItem itemLabel="Auto Serviço" itemValue="autoServico" />
									<f:selectItem itemLabel="Pedido" itemValue="pedido" />
									<f:selectItem itemLabel="Ambos" itemValue="ambos" />
								</p:selectOneRadio>
							</h:panelGroup>
						
							<h:panelGroup>
								<p:outputLabel value=" " />
								<br />
								<p:commandButton id="btnBuscar" 
											value="Pesquisar" 
											actionListener="#{vendaFornBean.buscar}" 
											update="@form :listagemVendaFornBean"
											icon="icon-search" 
											onclick="PF('bUIDataTableVendaForn').show()" />
							</h:panelGroup>			

							<h:panelGroup>
							    <p:outputLabel value=" " />
								<br />
								<p:commandButton id="btnLimpar" 
											value="Limpar"
											actionListener="#{vendaFornBean.limpar}" 
											update=":listagemVendaFornBean @form"
											icon="ui-icon-close"
											onclick="PF('bUIDataTableVendaForn').show()" />
							</h:panelGroup>				
						</p:panelGrid>
					</div>
			</p:panel>
		</h:form>

		<!-- Listagem -->

		<h:form id="listagemVendaFornBean">
			
			<p:blockUI block="tabview" widgetVar="bUIDataTableVendaForn">
				LOADING<br />
				<p:graphicImage library="images" name="progress_bar.gif" />
			</p:blockUI>
			
			<p:tabView id="tabview" widgetVar="tabPanelWidget" activeIndex="#{vendaFornBean.currentTab}" rendered="#{not empty vendaFornBean.lista or not empty vendaFornBean.formas}" styleClass="tabContent">
			
				<p:ajax event="tabChange" listener="#{vendaFornBean.onTabChange}" update="@none"/>
				<p:ajax event="tabClose" listener="#{vendaFornBean.onTabClose}" update="@form"/>

				<p:tab title="#{vendaFornBean.porFilterLabel}" id="tab0">
					
					<ui:fragment rendered="#{vendaFornBean.porFilter ne 'fpagto'}">
					
						<!-- Linha produto, Vendedor, Fornecedor -->
						<div class="ui-g-0 ui-md-0 ui-lg-0">	 
							<p:commandButton icon="icon-excel" disabled="#{empty vendaFornBean.lista}" title="Exportar para excel" ajax="false">
					            <p:dataExporter type="xls" target="dtVendaForn" fileName="#{vendaFornBean.porFilterLabel}"  />
					        </p:commandButton>
				    	</div>
	
						<p:remoteCommand name="updateListVendaFornProjetoBean" update="@form" />
	
						<p:dataTable id="dtVendaForn" var="vendaForn"
							value="#{vendaFornBean.lista}"
							emptyMessage="Nenhum registro encontrado."
							reflow="true">
	
							<p:column sortBy="#{vendaForn.descricao}">
							<f:facet name="header">#{vendaFornBean.porFilterColumn}</f:facet>
								<h:outputText value="#{car.id} " />
								<h:outputText value="#{vendaForn.descricao}" />
							</p:column>
	
							<p:column sortBy="#{vendaForn.valor}" styleClass="customCollumnValorGrande">
								<f:facet name="header">Valor</f:facet>
								<h:outputText value="#{vendaForn.valor}" converter="currencyFormat" />
							</p:column>
							
							<p:column sortBy="#{vendaForn.vlDevolvido}" styleClass="customCollumnValorGrande">
								<f:facet name="header">Dev.</f:facet>
								<h:outputText value="#{vendaForn.vlDevolvido}" converter="currencyFormat" rendered="#{vendaForn.vlDevolvido gt 0}" />
							</p:column>
							
							<p:column sortBy="#{vendaForn.desconto}" styleClass="customCollumnValor">
								<f:facet name="header">Desc.</f:facet>
								<h:outputText value="#{vendaForn.desconto}" converter="currencyFormat" />
							</p:column>
							
							<p:column sortBy="#{vendaForn.percValor}" styleClass="customCollumnValor">
								<f:facet name="header">%</f:facet>
								<h:outputText value="#{vendaForn.percValor}">
									<f:convertNumber minFractionDigits="2" maxFractionDigits="2" locale="pt_BR" />
								</h:outputText>
							</p:column>
							
							<p:column styleClass="customCollumn1Icon" exportable="false" priority="1">
								<f:facet name="header"></f:facet>
								<p:commandButton id="btnOpenProduto"
											actionListener="#{vendaFornBean.openProduto}"
											update=":listagemVendaFornBean" 
											process="@this" 
											icon="ui-icon-plus"
											title="Mostrar Produtos"
											onstart="PF('bUIDataTableVendaForn').show();"
											oncomplete="focusInPainel('#listagemVendaFornBean\\:tabview', 100);">
									<f:setPropertyActionListener target="#{vendaFornBean.selecionada}" value="#{vendaForn}" />
								</p:commandButton>
							</p:column>
							
							<p:columnGroup type="footer">
	               				<p:row>
						            <p:column footerText="Total:" style="text-align:right;" styleClass="tx_bold" />
						            <p:column style="text-align:right;" >
						            	<f:facet name="footer">
						                	<h:outputText value="#{vendaFornBean.valorTotal}" converter="currencyFormat" styleClass="tx_bold"/>
					                	</f:facet>
						            </p:column>
						            <p:column style="text-align:right;" >
						            	<f:facet name="footer">
						                	<h:outputText value="#{vendaFornBean.valorTotalDev}" converter="currencyFormat" styleClass="tx_bold"/>
						                </f:facet>
						            </p:column>
						            <p:column />
						            <p:column />
						            <p:column />
						        </p:row>
	        				</p:columnGroup>
	
						</p:dataTable>
						
						<div class="ui-datatable ui-widget w3-hide-large w3-hide-medium">
				        <div class="ui-datatable-tablewrapper">
							<table role="grid">
								<tr>
									<td class="ui-state-default" style="text-align:right">Total: </td>
									<td class="ui-state-default" style="text-align:right">
										<h:outputText value="#{vendaFornBean.valorTotal}" converter="currencyFormat" styleClass="tx_bold"/>
									</td>
								</tr>
								<tr>
									<td class="ui-state-default" style="text-align:right">Devolução: </td>
									<td class="ui-state-default" style="text-align:right">
										<h:outputText value="#{vendaFornBean.valorTotalDev}" converter="currencyFormat" styleClass="tx_bold"/>
									</td>
								</tr>
							</table>
						</div>
						</div>
					
					</ui:fragment>
					
					<!-- Forma pagamento -->
					<ui:fragment rendered="#{vendaFornBean.porFilter eq 'fpagto'}">
					
						<p:commandButton icon="icon-excel" disabled="#{empty vendaFornBean.formas}" title="Exportar para excel" ajax="false">
				            <p:dataExporter type="xls" target="dtVendaFornFPagto" fileName="FormaPagtoPainelVendas"  />
				        </p:commandButton>
				        
						<p:dataTable id="dtVendaFornFPagto" 
									var="vendaFornFPagto" 
									value="#{vendaFornBean.formas}" 
									emptyMessage="Nenhum registro encontrado." 
									sortBy="#{vendaFornFPagto.valor}" 
									sortOrder="descending"
									reflow="true"
									>
									
							<p:column sortBy="#{vendaFornFPagto.descricao}">
								<f:facet name="header">F. Pagto</f:facet>
								<h:outputText value="#{vendaFornFPagto.descricao} " />
								<!-- <h:outputText value="(#{vendaFornFPagto.parcela}x) " rendered="#{not empty vendaFornFPagto.parcela}" /> -->
							</p:column>
							
							<p:column sortBy="#{vendaFornFPagto.valor}" styleClass="customCollumnValorGrande">
								<f:facet name="header">Valor</f:facet>
								<h:outputText value="#{vendaFornFPagto.valor}" converter="currencyFormat" />
							</p:column>
							
							<p:column sortBy="#{vendaFornFPagto.desconto}" styleClass="customCollumnValor">
								<f:facet name="header">Desc.%</f:facet>
								<h:outputText value="#{vendaFornFPagto.desconto}" converter="currencyFormat" />
							</p:column>
							
							<p:column styleClass="customCollumnValor">
								<f:facet name="header">%</f:facet>
								<h:outputText value="#{vendaFornFPagto.perc(vendaFornBean.somaValorTotalFPagto)}">
									<f:convertNumber minFractionDigits="2" maxFractionDigits="2" locale="pt_BR" />
								</h:outputText>
							</p:column>
							
							<p:column styleClass="customCollumn1Icon" exportable="false">
								<p:commandButton id="btnOpenECFs"
									icon="ui-icon-search"
									actionListener="#{vendaFornBean.buscarNFCes}"
									update="@form:dtNFCes"
									onsuccess="PF('dialogOpenECFs').show()" 
									rendered="#{vendaFornFPagto.descricao eq 'NFC-e SEM REG.PAGTO'}" />
									
								<p:commandButton id="btnOpenPedidosPorFPagto"
											actionListener="#{vendaFornBean.openPedidoFPagto}"
											update=":listagemVendaFornBean" 
											process="@this" 
											icon="ui-icon-plus"
											title="Mostrar Pedidos" 
											rendered="#{empty vendaFornFPagto.filhos and vendaFornFPagto.descricao ne 'NFC-e SEM REG.PAGTO'}"
											onstart="PF('bUIDataTableVendaForn').show();"
											oncomplete="focusInPainel('#listagemVendaFornBean\\:tabview', 100);"
											>
									<f:setPropertyActionListener target="#{vendaFornBean.selecionadaFPagto}" value="#{vendaFornFPagto}" />
									<f:setPropertyActionListener target="#{vendaFornBean.tituloPedidos}" value="#{vendaFornFPagto.descricao}" />
								</p:commandButton>
											
								<p:commandButton id="btnOpenPedidosPorFPagto2"
											actionListener="#{vendaFornBean.openFPagto}"
											update=":listagemVendaFornBean" 
											process="@this" 
											icon="ui-icon-plus"
											title="Expandir" 
											rendered="#{not empty vendaFornFPagto.filhos and vendaFornFPagto.descricao ne 'NFC-e SEM REG.PAGTO'}"
											onstart="PF('bUIDataTableVendaForn').show();"
											oncomplete="focusInPainel('#listagemVendaFornBean\\:tabview', 100);">
									<f:setPropertyActionListener target="#{vendaFornBean.selecionadaFPagtoCartoes}" value="#{vendaFornFPagto}" />		
								</p:commandButton>
							</p:column>
							
							<p:columnGroup type="footer">
	               				<p:row>
						            <p:column footerText="Total" style="text-align:right;" styleClass="tx_bold" />
						            <p:column style="text-align:right;" >
						            	<f:facet name="footer">
						                	<h:outputText value="#{vendaFornBean.somaValorTotalFPagto}" converter="currencyFormat" styleClass="tx_bold"/>
					                	</f:facet>
						            </p:column>
						            <p:column />
						            <p:column />
						            <p:column />
						        </p:row>
	        				</p:columnGroup>
							
						</p:dataTable>
						
						<div class="ui-datatable ui-widget w3-hide-large w3-hide-medium">
					        <div class="ui-datatable-tablewrapper">
								<table role="grid">
									<tr>
										<td class="ui-state-default" style="text-align:right">Total: </td>
										<td class="ui-state-default" style="text-align:right">
											<h:outputText value="#{vendaFornBean.somaValorTotalFPagto}" converter="currencyFormat" styleClass="tx_bold"/>
										</td>
									</tr>
								</table>
							</div>
						</div>
						
					</ui:fragment>
					
										<div class="ui-g" style="margin-top: 10px;">
						<div class="ui-g-12 ui-md-6 ui-lg-4">
							<p:panel>
								<f:facet name="header">
									<p:outputLabel value="Posição em: " /> 
									<p:outputLabel value="#{vendaFornBean.dataFilter2}" styleClass="tx_bold">
										<f:convertDateTime pattern="dd/MM" />
									</p:outputLabel>
								</f:facet>
								<table width="100%">
									<tr>
										<td>
											<p:outputLabel value="Clientes:" />
										</td>
										<td align="right" width="10"><h:outputText value="#{vendaFornBean.numClientesDoDia}" styleClass="tx_bold" /></td>
									</tr>
									<tr>
										<td>
											<p:outputLabel value="Faturado: " />
										</td>
										<td align="right" width="10">
											<h:outputText value="#{vendaFornBean.faturamentoDia}" converter="currencyFormat" styleClass="tx_bold" />
										</td>
									</tr>
									<tr>
										<td>
											<p:outputLabel value="Devolvido: " />
										</td>
										<td align="right" width="10">
											<h:outputText value="#{vendaFornBean.devolucaoDia}" converter="currencyFormat" styleClass="tx_bold" />
										</td>
									</tr>
									<tr>
										<td>
											<p:outputLabel value="Venda Liq.: " />
										</td>
										<td align="right" width="10">
											<h:outputText value="#{vendaFornBean.faturamentoDia - vendaFornBean.devolucaoDia}" converter="currencyFormat" styleClass="tx_bold" />
										</td>
									</tr>
									<tr>
										<td>
											<p:outputLabel value="Ticket Médio: " />
										</td>
										<td align="right" width="10">
											<h:outputText value="#{vendaFornBean.ticketMedioDia}" converter="currencyFormat" styleClass="tx_bold" />
										</td>
									</tr>
								</table>
							</p:panel>
						</div>
						<div class="ui-g-12 ui-md-6 ui-lg-4">
							<p:panel>
								<f:facet name="header">
									<p:outputLabel value="Posição até: " /> 
									<p:outputLabel value="#{vendaFornBean.dataFilter2}" styleClass="tx_bold">
										<f:convertDateTime pattern="dd/MM" />
									</p:outputLabel>
								</f:facet>
								<table width="100%">
									<tr>
										<td>
											<p:outputLabel value="Clientes: " />
										</td>
										<td align="right" width="10">
											<h:outputText value="#{vendaFornBean.numClientes}" styleClass="tx_bold" />
										</td>
									</tr>
									<tr>
										<td>
											<p:outputLabel value="Faturado: " /> 
										</td>
										<td align="right" width="10">
											<h:outputText value="#{vendaFornBean.resumo.faturamento}" converter="currencyFormat" styleClass="tx_bold" />
										</td>
									</tr>
									<tr>
										<td>
											<p:outputLabel value="Devolvido: " />
										</td>
										<td align="right" width="10">
											<h:outputText value="#{vendaFornBean.resumo.devolucao}" converter="currencyFormat" styleClass="tx_bold" />											
										</td>
									</tr>
									<tr>
										<td>
											<p:outputLabel value="Venda Liq.: " />
										</td>
										<td align="right" width="10">
											<h:outputText value="#{vendaFornBean.resumo.faturamento - vendaFornBean.resumo.devolucao}" converter="currencyFormat" styleClass="tx_bold" />
										</td>
									</tr>
									<tr>
										<td>
											<p:outputLabel value="Ticket Médio: " />
										</td>
										<td align="right" width="10">
											<h:outputText value="#{vendaFornBean.resumo.ticketMedio}" converter="currencyFormat" styleClass="tx_bold" />
										</td>
									</tr>
								</table>
							</p:panel>
						</div>
						<div class="ui-g-12 ui-md-6 ui-lg-4">
							<p:panel header="Outros">
								<table width="100%">
									<tr>
										<td>
											<p:outputLabel value="Tendência: " />
										</td>
										<td align="right" width="10">
											<h:outputText value="#{vendaFornBean.resumo.getTendencia(vendaFornBean.diasUteis)}" converter="currencyFormat" styleClass="tx_bold" />
										</td>
									</tr>
									<tr>
										<td>
											<p:outputLabel value="Média Diária: " /> 
										</td>
										<td align="right" width="10">
											<h:outputText value="#{vendaFornBean.mediaDia}" converter="currencyFormat" styleClass="tx_bold" />
										</td>
									</tr>
									<tr>
