<ui:composition xmlns="http://www.w3.org/1999/xhtml"   
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://java.sun.com/jsf/core">
	<h:form>
		<p:poll id="pollPainel" interval="300"
			listener="#{idleMonitorView.onkeepSessionAlive}" update="count"
			autoStart="true" />
		<h:outputLabel id="count" value="#{idleMonitorView.count}" style="display:none;" />
	</h:form>
</ui:composition>
